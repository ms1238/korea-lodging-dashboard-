# Temporary: 관광 체류 강도 history (2021–2025) for 특·광역시, sample months, for a research sample.
name: Probe stay-intensity history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-stay.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, json, requests
          K = os.environ["KEY"]; U = "https://apis.data.go.kr/B551011/AreaTarDemDsService/areaTarSjrnDsList"
          def get(ym, area, code):
              try:
                  d = requests.get(U, params={"serviceKey": K, "pageNo": 1, "numOfRows": 100, "MobileOS": "ETC", "MobileApp": "probe", "_type": "json",
                                              "baseYm": ym, "areaCd": area, "tarSjrnDsIxCd": code}, timeout=60).json()
                  b = d["response"]["body"]; it = b["items"]["item"] if b.get("items") else []
                  return [x for x in (it if isinstance(it, list) else [it]) if str(x.get("signguCd")) == "0"]
              except Exception as e:
                  return f"ERR {str(e)[:120]}"
          # 1) how far back does it go? (서울, 체류 강도)
          for ym in ("201901", "202001", "202101", "202201", "202301", "202401"):
              print("== first", ym, get(ym, "11", "21"), flush=True)
          # 2) sample: Jan/Apr/Jul/Oct of 2021-2025, 특·광역시, 체류 강도(21)·숙박 비중(2102)
          out = []
          for y in range(2021, 2026):
              for m in ("01", "04", "07", "10"):
                  for area in ("11", "26", "27", "28", "29", "30", "31"):
                      for code in ("21", "2102"):
                          r = get(f"{y}{m}", area, code)
                          if isinstance(r, list) and r:
                              out.append({"ym": f"{y}{m}", "area": area, "ix": code, "v": float(r[0].get("tarSjrnDsIxVal")), "nm": r[0].get("areaNm")})
          print("== SAMPLE " + json.dumps(out, ensure_ascii=False), flush=True)
