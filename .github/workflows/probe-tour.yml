# Temporary: OSM rail route relations in Korea (KTX/SRT/광역철도 names, colours, networks).
name: Probe tourism demand / balance APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-tour.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - shell: python
        run: |
          import sys; sys.path.insert(0, "scripts")
          from collections import Counter
          from fetch import overpass
          rels = overpass("""[out:json][timeout:240];relation["route"~"^(train|subway|light_rail)$"](33.0,124.5,38.7,131.0);out tags;""")
          print("== routes", Counter(r["tags"].get("route") for r in rels))
          for r in sorted(rels, key=lambda r: (r["tags"].get("route"), r["tags"].get("name", ""))):
              t = r["tags"]
              if t.get("route") == "train" or any(w in t.get("operator", "") + t.get("network", "") for w in ("Korail", "코레일", "한국철도")):
                  print("  ", t.get("route"), "|", t.get("name", "")[:45], "|", t.get("ref", ""), "|", t.get("colour", ""), "|", t.get("network", "")[:25], "|", t.get("service", ""), "|", t.get("operator", "")[:15])
