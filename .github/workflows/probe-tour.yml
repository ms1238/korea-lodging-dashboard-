# Temporary: specs and sample responses of 한국관광공사 지역별 관광 자원 수요 and 한국문화관광연구원 tour.go.kr services.
name: Probe tourism demand / balance APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-tour.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, json, requests
          K = os.environ["KEY"]
          def show(tag, url, **p):
              try:
                  r = requests.get(url, params={"serviceKey": K, **p}, timeout=60)
                  print(f"== {tag} {r.status_code} {r.headers.get('content-type')} {r.text[:900]!r}", flush=True)
              except Exception as e:
                  print(f"== {tag} ERR {e}", flush=True)
          # round 2: parameters for the two AreaTarResDemService operations, operation names of 관광수지
          A = "https://apis.data.go.kr/B551011/AreaTarResDemService/"
          base = dict(MobileOS="ETC", MobileApp="probe", _type="json", numOfRows=5, pageNo=1, baseYm="202508", areaCd="11")
          for op, prm in (("areaTarSvcDemList", "tarSvcDemIxCd"), ("areaCulResDemList", "culResDemIxCd")):
              for code in ("1", "11", "12", "13", "1101", "1102", "1103", "1201", "1202", "1301"):
                  show(f"{op} {prm}={code}", A + op, **base, **{prm: code})
          show("areaTarSvcDemList no code", A + "areaTarSvcDemList", **base)
          show("areaTarSvcDemList signgu", A + "areaTarSvcDemList", **{**base, "signguCd": "11110"}, tarSvcDemIxCd="11")
          T = "http://openapi.tour.go.kr/openapi/service/EdrcntTourismBalnaceService/"
          for op in ("getEdrcntTourismBalnaceList", "getEdrcntTourismBalanceList", "getTourismBalnaceList", "getTourismBalanceList", "getEdrcntTourismBalnace", "getBalnaceList"):
              for p in ({"YM": "202508"}, {"YM": "202508", "_type": "json"}, {"YEAR": "2025"}, {}):
                  show(f"balance {op} {p}", T + op, **p)
          for path in ("TourismResourceStatsService/getPchrgTrrsrtVisitorList", "TourismIndustStatsService/getTourismBsnesTrendIndexList", "TourismAccdtService/getTourismTotqyList"):
              show("tour.go.kr " + path, "http://openapi.tour.go.kr/openapi/service/" + path, YM="202508", numOfRows=3, pageNo=1)
