# 임시: 관광수요지수 API가 2024년 10월 이전 달을 주는지 확인. 확인 후 삭제.
name: KTO index probe
on:
  push:
    branches: [claude/dreamy-bell-2hibbc]
    paths: [".github/workflows/kto-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Ask a few past months
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse
          key = os.environ["KEY"]
          ops = [("AreaTarDemDsService/areaTarSjrnDsList", "tarSjrnDsIxCd", "2102", "tarSjrnDsIx"),
                 ("AreaTarDemDsService/areaTarExpDsList", "tarExpDsIxCd", "22", "tarExpDsIx"),
                 ("AreaTarResDemService/areaTarSvcDemList", "tarSvcDemIxCd", "1107", "tarSvcDemIx"),
                 ("AreaTarDivService/areaTouDivList", "touDivIxCd", "31", "touDivIx")]
          months = ["201801", "201901", "202001", "202101", "202201", "202301", "202306", "202401", "202406", "202409", "202410"]
          for op, p, ix, f in ops:
              print("####", op, ix)
              for ym in months:
                  q = {"serviceKey": key, "pageNo": 1, "numOfRows": 100, "MobileOS": "ETC", "MobileApp": "korea-lodging-dashboard", "_type": "json", "baseYm": ym, "areaCd": "11", p: ix}
                  url = "https://apis.data.go.kr/B551011/" + op + "?" + urllib.parse.urlencode(q)
                  try:
                      d = json.load(urllib.request.urlopen(url, timeout=60))
                      h = d.get("response", {}).get("header", {}); b = d.get("response", {}).get("body", {})
                      it = (b.get("items") or {}).get("item") if isinstance(b.get("items"), dict) else []
                      it = it if isinstance(it, list) else ([it] if it else [])
                      sgg = sum(1 for x in it if str(x.get("signguCd")) != "0")
                      print(ym, "code", h.get("resultCode"), "items", len(it), "sgg", sgg, "sample", (it[0].get("signguNm"), it[0].get(f + "Nm"), it[0].get(f + "Val")) if it else None)
                  except Exception as e:
                      print(ym, "ERR", repr(e)[:200])
                  time.sleep(0.3)
          PY
