name: Research - daily visitors around festivals

# research/fetch_daily.py 를 secret 키로 돌려 research/daily_visitors.csv.gz 를 같은 브랜치에 커밋합니다.
# 사이트 배포(update.yml)와는 별개이고, 데이터랩 요청은 18건 정도입니다.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["research/fetch_daily.py", ".github/workflows/research-daily.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch daily DataLab visitors
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python research/fetch_daily.py
      - name: Commit the file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/daily_visitors.csv.gz
          git diff --cached --quiet || git commit -m "일별 외지인 방문자 (축제 전후, research/fetch_daily.py)"
          git push
