# Temporary: columns of 국립공원공단 탐방객 통계 (odcloud 15107577) before the key is approved.
name: Probe park visitor API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-park.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, json, time, requests
          H = {"User-Agent": "Mozilla/5.0"}
          def get(u, **kw):
              for a in range(4):
                  try:
                      return requests.get(u, headers=H, timeout=60, **kw)
                  except Exception as e:
                      print("  retry", type(e).__name__, flush=True); time.sleep(10)
          seen = {}
          for kw in ("국립공원 탐방객", "국립공원공단 탐방객", "국립공원 탐방객 현황", "국립공원 월별 탐방객"):
              for dt in ("FILE", "API"):
                  t = get("https://www.data.go.kr/tcs/dss/selectDataSetList.do", params={"keyword": kw, "dType": dt, "perPage": 40}).text
                  for cid, kind in re.findall(r"/data/(\d{8})/(fileData|openapi)\.do", t):
                      seen.setdefault(cid, kind)
          print("== ids", seen, flush=True)
          for cid, kind in seen.items():
              t = get(f"https://www.data.go.kr/data/{cid}/{kind}.do").text
              title = re.findall(r"<title>(.*?)</title>", t, re.S)[:1]
              if "탐방" not in t: continue
              print("== DATASET", cid, kind, title, flush=True)
              sp = get(f"https://infuser.odcloud.kr/oas/docs?namespace={cid}/v1")
              try:
                  sp = sp.json()
              except Exception:
                  print("   no odcloud spec"); continue
              for path, v in sp.get("paths", {}).items():
                  print("   PATH", path, v["get"].get("summary"))
              for name, sc in sp.get("components", {}).get("schemas", {}).items():
                  if name.endswith("_model"): print("   COLS", name[:40], list(sc.get("properties", {})))
              path = list(sp.get("paths", {}))[:1]
              if path:
                  r = get("https://api.odcloud.kr/api" + path[0], params={"serviceKey": os.environ["KEY"], "page": 1, "perPage": 3, "returnType": "JSON"})
                  print("   CALL", r.status_code, r.text[:700], flush=True)
