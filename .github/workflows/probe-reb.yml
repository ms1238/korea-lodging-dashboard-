# Temporary: list R-ONE (한국부동산원 부동산통계) tables reachable with REB_KEY.
name: Probe R-ONE
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-reb.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.REB_KEY }}
        shell: python
        run: |
          import os, json, re, requests
          K = os.environ["KEY"]
          print("key set:", bool(K), flush=True)
          base = "https://www.reb.or.kr/r-one/openapi/"
          rows, page = [], 1
          while page <= 30:
              r = requests.get(base + "SttsApiTbl.do", params={"KEY": K, "Type": "json", "pIndex": page, "pSize": 1000}, timeout=60)
              try:
                  d = r.json()
              except Exception:
                  print("NONJSON", r.status_code, r.text[:500]); break
              blk = d.get("SttsApiTbl")
              if not blk:
                  print("RESP", json.dumps(d, ensure_ascii=False)[:600]); break
              head = blk[0].get("head", [])
              got = blk[1].get("row", []) if len(blk) > 1 else []
              if page == 1:
                  print("HEAD", json.dumps(head, ensure_ascii=False)[:400])
              rows += got
              total = next((h.get("list_total_count") for h in head if "list_total_count" in h), 0)
              if not got or len(rows) >= int(total or 0):
                  break
              page += 1
          print("TOTAL TABLES", len(rows))
          if rows:
              print("FIELDS", list(rows[0].keys()))
          pat = re.compile("지가|숙박|상업용|임대|거래|투자수익|공실|오피스|상가|토지")
          for t in rows:
              nm = t.get("STATBL_NM", "")
              if pat.search(nm):
                  print("T", t.get("STATBL_ID"), t.get("DTACYCLE_CD"), nm)
