# Temporary: inspect a few R-ONE tables (first page of items and data only).
name: Probe R-ONE
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-reb.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - env:
          KEY: ${{ secrets.REB_KEY }}
        shell: python
        run: |
          import os, json, re, time, requests
          K, base = os.environ["KEY"], "https://www.reb.or.kr/r-one/openapi/"
          def one(svc, **p):
              for attempt in range(3):
                  try:
                      t = time.time()
                      r = requests.get(base + svc, params={"KEY": K, "Type": "json", "pIndex": 1, "pSize": 100, **p}, timeout=(10, 40), headers={"Connection": "close"})
                      d = r.json(); blk = d.get(svc.replace(".do", ""))
                      if not blk:
                          print("  RESP", json.dumps(d, ensure_ascii=False)[:300], flush=True); return 0, []
                      total = next((h.get("list_total_count") for h in blk[0].get("head", []) if "list_total_count" in h), 0)
                      print(f"  ({svc} {time.time() - t:.1f}s)", flush=True)
                      return total, (blk[1].get("row", []) if len(blk) > 1 else [])
                  except Exception as e:
                      print("  retry", attempt, type(e).__name__, str(e)[:120], flush=True); time.sleep(5)
              return 0, []
          for tid, cyc, y0, y1 in (("A_2024_00902", "YY", "2025", "2025"), ("A_2024_00567", "YY", "2025", "2025"), ("A_2024_00501", "YY", "2023", "2024"), ("T245113133421365", "MM", "202508", "202508")):
              print("=====", tid, flush=True)
              n, it = one("SttsApiTblItm.do", STATBL_ID=tid)
              print("  ITEMS total", n, "fields", list(it[0].keys()) if it else None, flush=True)
              for r in it[:100]:
                  print("   ", r.get("ITM_TAG") or r.get("ITM_TAG_NM"), r.get("ITM_ID"), r.get("PAR_ITM_ID"), r.get("ITM_FULLNM") or r.get("ITM_NM"), flush=True)
              n, dt = one("SttsApiTblData.do", STATBL_ID=tid, DTACYCLE_CD=cyc, START_WRTTIME=y0, END_WRTTIME=y1)
              print("  DATA total", n, flush=True)
              for r in dt[:4]:
                  print("   ", json.dumps(r, ensure_ascii=False)[:500], flush=True)
