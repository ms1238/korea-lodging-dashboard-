# Temporary: morning check — 관광수지 API, and 숙박 비중 지수 (2102) per 시군구 for 2022 and 2025 (Jan/Apr/Jul/Oct means).
name: Probe morning check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-morning.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, requests
          from collections import defaultdict
          K = os.environ["KEY"]
          try:
              r = requests.get("http://openapi.tour.go.kr/openapi/service/EdrcntTourismBalnaceService/getTourismBalcList", params={"serviceKey": K, "YM": "202508"}, timeout=30)
              print(f"== balance {r.status_code} {r.text[:700]!r}", flush=True)
          except Exception as e:
              print("== balance ERR", e, flush=True)
          U = "https://apis.data.go.kr/B551011/AreaTarDemDsService/areaTarSjrnDsList"
          acc, errs = defaultdict(list), 0
          for y in (2022, 2025):
              for m in ("01", "04", "07", "10"):
                  for a in ("11", "26", "27", "28", "29", "30", "31", "36", "41", "43", "44", "46", "47", "48", "50", "51", "52", "12"):
                      try:
                          d = requests.get(U, params={"serviceKey": K, "pageNo": 1, "numOfRows": 100, "MobileOS": "ETC", "MobileApp": "probe", "_type": "json",
                                                      "baseYm": f"{y}{m}", "areaCd": a, "tarSjrnDsIxCd": "2102"}, timeout=60).json()
                          if "response" not in d:
                              errs += 1
                              if errs <= 2: print("== ERR body", str(d)[:200], flush=True)
                              continue
                          b = d["response"]["body"]; it = b["items"]["item"] if b.get("items") else []
                          for x in (it if isinstance(it, list) else [it]):
                              acc[(x.get("areaNm"), x.get("signguNm"), str(y))].append(float(x.get("tarSjrnDsIxVal")))
                      except Exception as e:
                          errs += 1
                          print("== ERR", y, m, a, str(e)[:100], flush=True)
          print(f"== errors {errs}; MEANS area|sgg|2022|2025", flush=True)
          for a, g in sorted({(a, g) for a, g, _ in acc}):
              m = lambda y: (f"{sum(acc[(a, g, y)]) / len(acc[(a, g, y)]):.2f}" if acc.get((a, g, y)) else "")
              print(f"{a}|{g}|{m('2022')}|{m('2025')}", flush=True)
