# Temporary: which baseYm / indicator / area codes return data from the 관광 다양성 and 관광 수요 강도 APIs.
name: Probe KTO data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-kto.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, requests
          K = os.environ["KEY"]
          B = "https://apis.data.go.kr/B551011/"
          base = {"serviceKey": K, "pageNo": 1, "numOfRows": 20, "MobileOS": "ETC", "MobileApp": "test", "_type": "json"}
          def call(path, **p):
              try:
                  t = requests.get(B + path, params={**base, **p}, timeout=60).text
              except Exception as e:
                  t = type(e).__name__
              n = t.split('"totalCount":')[1].split("}")[0] if '"totalCount":' in t else "?"
              print(f"== {path} {p} total={n} {t[:900] if n not in ('0', '?') else t[:200]}\n", flush=True)
              return n
          for ym in ("202608", "202606", "202512", "202506", "202412", "202312"):
              call("AreaTarDemDsService/areaTarSjrnDsList", areaCd="11", baseYm=ym)
              call("AreaTarDemDsService/areaTarSjrnDsList", areaCd="11", baseYm=ym, tarSjrnDsIxCd="21")
          for p in ({"areaCd": "11"}, {"areaCd": "11", "signguCd": "11110", "baseYm": "202506"}, {"areaCd": "26", "baseYm": "202506"},
                    {"areaCd": "11", "baseYm": "202506", "tarSjrnDsIxCd": "2103"}, {"areaCd": "1", "baseYm": "202506"}):
              call("AreaTarDemDsService/areaTarSjrnDsList", **p)
          for ym in ("202608", "202506", "202412"):
              call("AreaTarDivService/areaTouDivList", areaCd="11", baseYm=ym, touDivIxCd="31")
              call("AreaTarDivService/areaIntlDivList", areaCd="11", baseYm=ym, intlDivIxCd="33")
          call("AreaTarDemDsService/areaTarExpDsList", areaCd="11", baseYm="202506", tarExpDsIxCd="22")
