# Temporary: AreaTarDemDsService spec and sample values of the 관광 다양성 / 체류 APIs; 표준데이터 download path.
name: Probe KTO data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-kto.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, time, requests
          K = os.environ["KEY"]
          H = {"User-Agent": "Mozilla/5.0"}
          def get(u, **kw):
              for a in range(4):
                  try:
                      return requests.get(u, headers=H, timeout=60, **kw).text
                  except Exception as e:
                      print("  retry", u, type(e).__name__, flush=True); time.sleep(10)
              return ""
          def spec(cid, svc):
              t = get(f"https://www.data.go.kr/data/{cid}/openapi.do")
              m = re.search(r"swaggerJson\s*=\s*`(.*?)`", t, re.S)
              sw = m.group(1) if m else ""
              print("== FOUND", svc, cid, re.findall(r"<title>(.*?)</title>", t, re.S)[:1])
              print("== description:", re.findall(r'"description":"(.{0,900}?)"', sw)[:1])
              ops = re.findall(r'"(/\w+)":\{"get"', sw)
              for i, op in enumerate(ops):
                  j, k = sw.find(f'"{op}"'), (sw.find(f'"{ops[i + 1]}"') if i + 1 < len(ops) else len(sw))
                  part = sw[j:k]
                  print("== OP", op, re.findall(r'"summary":"([^"]*)"', part)[:1],
                        "\n   params:", list(dict.fromkeys(re.findall(r'"name":"([^"]+)","description":"([^"]*)"', part))),
                        "\n   fields:", list(dict.fromkeys(re.findall(r'"(\w+)":\{"type":"(?:string|number|integer)","description":"([^"]*)"', part))), flush=True)
              return ops
          hits = {}
          for cid in range(15151340, 15151400):
              t = get(f"https://www.data.go.kr/data/{cid}/openapi.do")
              for svc in re.findall(r"apis\.data\.go\.kr/B551011/(\w+)", t):
                  hits.setdefault(svc, cid)
          print("== B551011 services by dataset id:", hits, flush=True)
          base = {"serviceKey": K, "pageNo": 1, "numOfRows": 5, "MobileOS": "ETC", "MobileApp": "test", "_type": "json", "areaCd": "11", "baseYm": "202608"}
          for svc in ("AreaTarDemDsService", "AreaTarDivService"):
              ops = spec(hits[svc], svc) if svc in hits else []
              for op in ops:
                  for extra in ({}, {"signguCd": "11110"}):
                      r = get(f"https://apis.data.go.kr/B551011/{svc}{op}", params={**base, **extra})
                      print(f"== CALL {svc}{op} {extra} {r[:1500]}\n", flush=True)
          t = get("https://www.data.go.kr/data/15013205/standard.do")
          for k in ("limitAtchFileId", "fileDownload", "atchFileId", "url:", "ajax"):
              print(f"== STD {k}:", [re.sub(r"\s+", " ", x) for x in re.findall(r".{0,160}%s.{0,160}" % re.escape(k), t)][:6], flush=True)
