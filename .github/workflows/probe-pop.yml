# Temporary: parameters and a sample response of 행정안전부 지역별 주민등록 인구 (RegistrationPopulationByRegion).
name: Probe population API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-pop.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, time, requests
          K = os.environ["KEY"]
          H = {"User-Agent": "Mozilla/5.0"}
          def get(u, **kw):
              for a in range(4):
                  try:
                      return requests.get(u, headers=H, timeout=60, **kw).text
                  except Exception as e:
                      print("  retry", type(e).__name__, flush=True); time.sleep(10)
              return ""
          found = None
          for kw in ("RegistrationPopulationByRegion", "행정안전부 지역별 주민등록 인구", "주민등록 인구 지역별", "행정안전부 주민등록 인구"):
              t = get("https://www.data.go.kr/tcs/dss/selectDataSetList.do", params={"keyword": kw, "dType": "API", "perPage": 40})
              ids = list(dict.fromkeys(re.findall(r"/data/(\d{8})/openapi\.do", t)))
              print("== search", kw, ids[:20], flush=True)
              for cid in ids[:20]:
                  p = get(f"https://www.data.go.kr/data/{cid}/openapi.do")
                  if "RegistrationPopulationByRegion" in p:
                      found = (cid, p); break
              if found: break
          if found:
              cid, p = found
              print("== FOUND", cid, re.findall(r"<title>(.*?)</title>", p, re.S)[:1])
              m = re.search(r"swaggerJson\s*=\s*`(.*?)`", p, re.S); sw = m.group(1) if m else ""
              print("== description:", re.findall(r'"description":"(.{0,1200}?)"', sw)[:1])
              print("== params:", list(dict.fromkeys(re.findall(r'"name":"([^"]+)","description":"([^"]*)"', sw))))
              print("== fields:", list(dict.fromkeys(re.findall(r'"(\w+)":\{"type":"(?:string|number|integer)","description":"([^"]*)"', sw))), flush=True)
              print("== reqList:", re.findall(r'"paramtrNm":"([^"]+)","paramtrBassValue":"([^"]*)","paramtrDc":"([^"]*)"', sw)[:30], flush=True)
          B = "https://apis.data.go.kr/1741000/RegistrationPopulationByRegion/getRegistrationPopulationByRegion"
          for extra in ({}, {"type": "json"}, {"type": "json", "srchFrYm": "202609", "srchToYm": "202609", "lv": "1", "regSeCd": "1"},
                        {"type": "json", "admmCd": "1100000000"}, {"type": "json", "stdgCd": "1100000000"}):
              r = get(B, params={"serviceKey": K, "pageNo": 1, "numOfRows": 5, **extra})
              print(f"== CALL {extra} {r[:1500]}\n", flush=True)
