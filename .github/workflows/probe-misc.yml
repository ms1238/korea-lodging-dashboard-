# Temporary: summarize 전국관광지정보표준데이터.
name: Probe misc
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-misc.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, json, collections, requests
          K = os.environ["KEY"]
          url = "https://api.data.go.kr/openapi/tn_pubr_public_trrsrt_api"
          items, page = [], 1
          while page < 50:
              d = requests.get(url, params={"serviceKey": K, "pageNo": page, "numOfRows": 1000, "type": "json"}, timeout=90).json()
              b = d.get("body") or d.get("response", {}).get("body", {})
              it = (b.get("items") or {})
              it = it.get("item", []) if isinstance(it, dict) else it
              if page == 1: print("== TOTAL", b.get("totalCount"), flush=True)
              items += it
              if not it or len(items) >= int(b.get("totalCount") or 0): break
              page += 1
          print("== GOT", len(items), flush=True)
          C = collections.Counter
          print("== SE", C(i.get("trrsrtSe") for i in items), flush=True)
          print("== SIDO", C((i.get("rdnmadr") or i.get("lnmadr") or "?").split(" ")[0] for i in items).most_common(20), flush=True)
          num = lambda v: float(v) if str(v or "").replace(".", "", 1).isdigit() else None
          for k in ("latitude", "ar", "aceptncCo", "stayngInfo", "appnDate", "prkplceCo"):
              print(f"== FILL {k}", sum(1 for i in items if str(i.get(k) or "").strip() not in ("", "0")), flush=True)
          ac = sorted(num(i.get("aceptncCo")) or 0 for i in items)
          print("== ACEPT quantiles", [ac[int(len(ac) * q)] for q in (0.25, 0.5, 0.75, 0.9, 0.99)], "n>=1000", sum(1 for a in ac if a >= 1000), flush=True)
          ar = sorted(num(i.get("ar")) or 0 for i in items)
          print("== AREA quantiles", [ar[int(len(ar) * q)] for q in (0.25, 0.5, 0.75, 0.9)], "n>=100000", sum(1 for a in ar if a >= 100000), flush=True)
          print("== REFDATE", C((i.get("referenceDate") or "")[:4] for i in items), flush=True)
          for i in [x for x in items if x.get("trrsrtSe") != "관광지"][:5] + sorted(items, key=lambda x: -(num(x.get("aceptncCo")) or 0))[:8]:
              print("== EX", i.get("trrsrtSe"), i.get("trrsrtNm"), i.get("lnmadr") or i.get("rdnmadr"), "ar", i.get("ar"), "acpt", i.get("aceptncCo"), "stay", i.get("stayngInfo"), "appn", i.get("appnDate"), flush=True)
