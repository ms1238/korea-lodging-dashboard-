# Temporary: read the standard-data download script's endpoints.
name: Probe misc
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-misc.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - shell: python
        run: |
          import re, requests
          ua = {"User-Agent": "Mozilla/5.0"}
          t = requests.get("https://www.data.go.kr/js/biz/mvc/std/std-download-manager.js", headers=ua, timeout=60).text
          i = t.find("this.url")
          print("== URLBLOCK", re.sub(r"\s+", " ", t[i:i + 1200]), flush=True)
          for name in ("getHeader", "downloadCsv", "getData", "fetch(", "ajax"):
              j = t.find(name)
              while j >= 0 and name in ("getHeader", "downloadCsv"):
                  if re.match(r"\s*(async\s+)?" + re.escape(name) + r"\s*\(", t[j - 6:j + 30].lstrip()) or t[j - 6:j].strip().endswith("async"):
                      break
                  j = t.find(name, j + 1)
              if j >= 0:
                  print(f"== FN {name}", re.sub(r"\s+", " ", t[j:j + 900]), flush=True)
          p = requests.get("https://www.data.go.kr/data/15013205/standard.do", headers=ua, timeout=60).text
          for m in re.finditer(r'<input[^>]+type="hidden"[^>]*>', p):
              s = m.group(0)
              if re.search(r'value="[^"]+"', s): print("== HIDDEN", s[:220], flush=True)
