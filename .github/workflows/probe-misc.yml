# Temporary: what columList.json / standard.json return.
name: Probe misc
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-misc.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - shell: python
        run: |
          import json, requests
          ref = "https://www.data.go.kr/data/15013205/standard.do"
          s = requests.Session(); s.headers.update({"User-Agent": "Mozilla/5.0", "Referer": ref, "X-Requested-With": "XMLHttpRequest"})
          s.get(ref, timeout=60)
          for ext in ("JSON", "CSV", "XLS"):
              r = s.get("https://www.data.go.kr/download/columList.json", params={"pk": "15093755", "ext": ext}, timeout=60)
              print("== COL", ext, r.status_code, r.headers.get("content-type"), r.text[:900].replace("\n", " "), flush=True)
              try:
                  h = r.json(); print("== KEYS", list(h) if isinstance(h, dict) else type(h), flush=True)
              except Exception as e:
                  print("== NOTJSON", e, flush=True)
