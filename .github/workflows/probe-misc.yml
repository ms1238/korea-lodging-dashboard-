# Temporary: columList.json with the page id itself.
name: Probe misc
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-misc.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - shell: python
        run: |
          import json, requests
          ref = "https://www.data.go.kr/data/15013205/standard.do"
          s = requests.Session(); s.headers.update({"User-Agent": "Mozilla/5.0", "Referer": ref, "X-Requested-With": "XMLHttpRequest"})
          s.get(ref, timeout=60)
          for pk in ("15013205", "15093755"):
              for extra in ({}, {"recommendDataYn": "Y"}, {"recommendDataYn": "N"}):
                  r = s.get("https://www.data.go.kr/download/columList.json", params={"pk": pk, "ext": "JSON", **extra}, timeout=60)
                  t = r.text
                  print("== COL", pk, extra, r.status_code, t[:300].replace("\n", " "), flush=True)
                  try:
                      h = r.json()
                  except Exception:
                      continue
                  if "columList" in h:
                      print("== HEAD", json.dumps({k: (v if k != "columList" else v[:12]) for k, v in h.items()}, ensure_ascii=False)[:1500], flush=True)
                      d = s.get("https://www.data.go.kr/download/standard.json", params={"publicDataPk": pk, "colNmList": h["tableVO"]["colNmList"], "totalCount": h["totalCount"],
                                "svcTableNm": h["tableVO"]["svcTableNm"], "perPage": 10000, "page": 0}, timeout=120)
                      print("== DATA", d.status_code, d.text[:800].replace("\n", " "), flush=True)
                      raise SystemExit
