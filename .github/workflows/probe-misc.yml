# Temporary: standard.json parameters.
name: Probe misc
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-misc.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - shell: python
        run: |
          import json, requests
          ref = "https://www.data.go.kr/data/15013205/standard.do"
          s = requests.Session(); s.headers.update({"User-Agent": "Mozilla/5.0", "Referer": ref, "X-Requested-With": "XMLHttpRequest"})
          s.get(ref, timeout=60)
          h = s.get("https://www.data.go.kr/download/columList.json", params={"pk": "15013205", "ext": "JSON"}, timeout=60).json()
          tv = h["tableVO"]
          print("== TOTAL", h.get("totalCount"), "| svc", tv.get("svcTableNm"), "| colNmList", repr(tv.get("colNmList"))[:400], flush=True)
          print("== OTHER KEYS", [k for k in h if k not in ("columList", "tableVO")], {k: h[k] for k in h if k not in ("columList", "tableVO")}, flush=True)
          print("== TV nonempty", {k: v for k, v in tv.items() if v not in ("", None, [], False, 0, 1, 10)}, flush=True)
          base = {"colNmList": tv.get("colNmList"), "totalCount": h.get("totalCount"), "svcTableNm": tv.get("svcTableNm"), "perPage": 10000}
          for pk in ("15013205", "15093755"):
              for page in (0, 1):
                  d = s.get("https://www.data.go.kr/download/standard.json", params={"publicDataPk": pk, **base, "page": page}, timeout=120)
                  print("== DATA", pk, page, d.status_code, len(d.text), d.text[:500].replace("\n", " "), flush=True)
