# Temporary: odcloud 15066765 full latest table + OSM bus_station coverage.
name: Probe odcloud 15066765
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-odcloud.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        working-directory: scripts
        run: |
          import os, json, requests, collections
          import sys; sys.path.insert(0, ".")
          from fetch import overpass
          d = requests.get("https://api.odcloud.kr/api/15066765/v1/uddi:192731a4-3542-49f2-bb00-e662b33b8862", params={"serviceKey": os.environ["KEY"], "page": 1, "perPage": 100, "returnType": "JSON"}, timeout=90).json()
          print("TABLE2024", json.dumps(d.get("data"), ensure_ascii=False))
          els = overpass('[out:json][timeout:240];area["ISO3166-1"="KR"][admin_level=2]->.k;(nwr["amenity"="bus_station"](area.k););out center tags;')
          print("OSM bus_station", len(els))
          named = [e for e in els if e.get("tags", {}).get("name")]
          print("named", len(named))
          kw = collections.Counter()
          for e in named:
              n = e["tags"]["name"]
              kw["터미널" if "터미널" in n else "기타"] += 1
          print(kw)
          print([e["tags"]["name"] for e in named if "터미널" in e["tags"]["name"]][:80])
          print("non-터미널 sample", [e["tags"]["name"] for e in named if "터미널" not in e["tags"]["name"]][:40])
