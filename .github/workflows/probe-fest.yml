# Temporary: what B553457/cultureinfo offers (operations, parameters, sample), and TourAPI festival search for comparison.
name: Probe festival APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-fest.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, time, requests
          K = os.environ["KEY"]
          H = {"User-Agent": "Mozilla/5.0"}
          def get(u, **kw):
              for a in range(4):
                  try:
                      return requests.get(u, headers=H, timeout=60, **kw).text
                  except Exception as e:
                      print("  retry", type(e).__name__, flush=True); time.sleep(10)
              return ""
          found = None
          for kw in ("cultureinfo", "한국문화정보원 축제", "한국문화정보원 공연전시", "문화정보 축제 행사", "한국문화정보원"):
              t = get("https://www.data.go.kr/tcs/dss/selectDataSetList.do", params={"keyword": kw, "dType": "API", "perPage": 40})
              ids = list(dict.fromkeys(re.findall(r"/data/(\d{8})/openapi\.do", t)))
              print("== search", kw, ids[:20], flush=True)
              for cid in ids[:25]:
                  p = get(f"https://www.data.go.kr/data/{cid}/openapi.do")
                  if "B553457/cultureinfo" in p:
                      found = (cid, p); break
              if found: break
          if found:
              cid, p = found
              print("== FOUND", cid, re.findall(r"<title>(.*?)</title>", p, re.S)[:1])
              m = re.search(r"swaggerJson\s*=\s*`(.*?)`", p, re.S); sw = m.group(1) if m else ""
              print("== description:", re.findall(r'"description":"(.{0,1200}?)"', sw)[:1])
              ops = re.findall(r'"(/\w+)":\{"get"', sw); print("== ops:", ops)
              for i, op in enumerate(ops):
                  j, k = sw.find(f'"{op}"'), (sw.find(f'"{ops[i + 1]}"') if i + 1 < len(ops) else len(sw)); part = sw[j:k]
                  print("== OP", op, re.findall(r'"summary":"([^"]*)"', part)[:1], "\n   params:", list(dict.fromkeys(re.findall(r'"name":"([^"]+)","description":"([^"]*)"', part))),
                        "\n   fields:", list(dict.fromkeys(re.findall(r'"(\w+)":\{"type":"(?:string|number|integer)","description":"([^"]*)"', part)))[:40], flush=True)
              print("== reqList:", re.findall(r'"paramtrNm":"([^"]+)","paramtrBassValue":"([^"]*)","paramtrDc":"([^"]*)"', sw)[:40], flush=True)
              for op in ops[:4]:
                  r = get(f"https://apis.data.go.kr/B553457/cultureinfo{op}", params={"serviceKey": K, "PageNo": 1, "pageNo": 1, "numOfrows": 3, "numOfRows": 3})
                  print(f"== CALL {op} {r[:1500]}\n", flush=True)
          r = get("https://apis.data.go.kr/B551011/KorService2/searchFestival2", params={"serviceKey": K, "numOfRows": 3, "pageNo": 1, "MobileOS": "ETC", "MobileApp": "test", "_type": "json", "eventStartDate": "20180101"})
          print(f"== TOURAPI searchFestival2 since 2018 {r[:1500]}\n", flush=True)
