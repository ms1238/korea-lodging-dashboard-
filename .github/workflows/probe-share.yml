# Temporary: 서울 외국인 방문 구별 비중(중구·종로구·성동구·동대문구) from the latest DataLab cache, for a report.
name: Probe Seoul foreign visitor shares
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-share.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: raw
          key: probe-${{ github.run_id }}
          restore-keys: raw-
      - shell: python
        run: |
          import sys
          sys.argv = ["share.py", "raw"]
          import json, sys
          from collections import defaultdict
          raw = sys.argv[1]
          gu, seoul, last = defaultdict(int), defaultdict(int), {}
          for line in open(f"{raw}/datalab_sgg.jsonl", encoding="utf-8"):
              r = json.loads(line)
              if r["kind"] == "3" and r["code"].startswith("11") and len(r["code"]) == 5:
                  gu[(r["name"], r["ym"])] += r["n"]
          for line in open(f"{raw}/datalab_sido.jsonl", encoding="utf-8"):
              r = json.loads(line)
              if r["kind"] == "3" and r["code"] == "11":
                  seoul[r["ym"]] += r["n"]; last[r["ym"]] = (r["last"], r["days"])
          names = sorted({g for g, _ in gu})
          def per(keys):
              tot = sum(seoul[k] for k in keys); gs = {g: sum(gu[(g, k)] for k in keys) for g in names}; return tot, gs, sum(gs.values())
          print("2026-09 last day in data:", last.get("202609"))
          periods = [(f"{y} 3분기", [f"{y}{m:02d}" for m in (7, 8, 9)]) for y in range(2019, 2027)] + [(f"{y} 연간", [f"{y}{m:02d}" for m in range(1, 13)]) for y in (2019, 2023, 2024, 2025)]
          print("기간,서울 전체(만),구 합계(만),중구(만),중구 비중(서울전체),중구 비중(구합계),종로구(만),종로구 비중(서울전체),종로구 비중(구합계),두 구 합(서울전체),성동구(만),성동구 비중(서울전체),동대문구(만),동대문구 비중(서울전체)")
          for name, keys in periods:
              tot, gs, sg = per(keys)
              if not sg: continue
              pc = lambda x, t: f"{x/t*100:.1f}%" if t else "-"
              f = lambda g: f"{gs[g]/1e4:.1f},{pc(gs[g], tot)}"
              print(f"{name},{tot/1e4:.1f},{sg/1e4:.1f},{gs['중구']/1e4:.1f},{pc(gs['중구'], tot)},{pc(gs['중구'], sg)},{gs['종로구']/1e4:.1f},{pc(gs['종로구'], tot)},{pc(gs['종로구'], sg)},{pc(gs['중구']+gs['종로구'], tot)},{f('성동구')},{f('동대문구')},동대문 구합계비중 {pc(gs['동대문구'], sg)},성동 구합계비중 {pc(gs['성동구'], sg)}")
