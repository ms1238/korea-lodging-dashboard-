# 임시: 외래관광객조사 KOSIS 표 구조 확인. 확인 후 삭제.
name: KOSIS probe
on:
  push:
    branches: [claude/dreamy-bell-2hibbc]
    paths: [".github/workflows/kosis-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch KOSIS tables
        env:
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, collections
          key = os.environ["KOSIS_KEY"]
          T = """1031880 13103136659 17
          1031881 13103136698 17
          1031882 13103136722 17
          1031883 13103136637 17
          1030579 13103133124 9
          1027417 13103121870 20
          1030580 13103133125 18
          1031446 13103135839 18
          1031447 13103135837 18
          1031448 13103135832 20
          1031449 13103135838 16
          1031450 13103135833 17
          1031451 13103135840 13
          1031886 13103136723 8
          1031887 13103136759 8
          1031888 13103136638 8
          1031890 13103136639 8
          1031896 13103136781 8
          1031899 13103136782 8
          1031900 13103136700 8
          1031902 13103136660 8
          1031903 13103136760 8
          1031904 13103136761 8
          1031905 13103136701 8
          1031906 13103136674 8
          1031907 13103136702 8
          1031908 13103136724 8
          1031909 13103136640 8
          1031910 13103136783 8
          1031912 13103136675 8"""
          for line in T.split("\n"):
              tid, p, n = line.split(); tbl = "DT_113_STBL_" + tid
              q = {"method": "getList", "apiKey": key, "itmId": " ".join(f"{p}T{i}" for i in range(1, int(n) + 1)) + " ",
                   "objL1": "ALL", "format": "json", "jsonVD": "Y", "prdSe": "Y", "newEstPrdCnt": "4", "orgId": "113", "tblId": tbl}
              url = "https://kosis.kr/openapi/Param/statisticsParameterData.do?" + urllib.parse.urlencode(q).replace("+", "%20")
              print("#" * 8, tbl)
              for k in range(3):
                  try:
                      d = json.load(urllib.request.urlopen(url, timeout=60)); break
                  except Exception as e:
                      d = {"fetch_error": repr(e)}; time.sleep(5)
              if isinstance(d, dict):
                  print("ERROR", d); continue
              print("NAME", d[0]["TBL_NM"], "| UNIT", sorted({r.get("UNIT_NM") for r in d}), "| N", len(d), "| PRD", sorted({r["PRD_DE"] for r in d}))
              print("ITEMS", json.dumps(dict(collections.OrderedDict(sorted(((r["ITM_ID"], r["ITM_NM"]) for r in d), key=lambda x: int(x[0].split("T")[-1])))), ensure_ascii=False))
              for c in ("C1", "C2", "C3"):
                  vals = list(collections.OrderedDict(((r.get(c + "_OBJ_NM"), r.get(c + "_NM")), 1) for r in d if r.get(c)).keys())
                  if vals: print(c, len(vals), json.dumps(vals[:12], ensure_ascii=False))
              tot = [r for r in d if r.get("C1_NM") == "전체" and not r.get("C2")]
              print("TOTAL", json.dumps([[r["PRD_DE"], r["ITM_ID"].split("T")[-1], r["DT"]] for r in sorted(tot, key=lambda r: (r["PRD_DE"], int(r["ITM_ID"].split("T")[-1])))], ensure_ascii=False))
          PY
