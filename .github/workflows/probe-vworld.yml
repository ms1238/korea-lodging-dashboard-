# Temporary: is VWorld reachable from GitHub Actions at all (overseas IP block?), and the data.go.kr fallback for 개별공시지가.
name: Probe VWorld API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-vworld.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: curl -sS -m 20 https://ipinfo.io/country || true
      - env:
          KEY: ${{ secrets.VWORLD_KEY }}
          DKEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, requests
          K, DK = os.environ["KEY"], os.environ["DKEY"]
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36",
                "Referer": "https://ms1238.github.io/korea-lodging-dashboard-/"}
          def show(tag, url, **kw):
              try:
                  r = requests.get(url, timeout=30, **kw)
                  print(f"== {tag}: {r.status_code} {dict((k, v) for k, v in r.headers.items() if k.lower() in ('server', 'content-type'))} {r.text[:600]!r}", flush=True)
              except Exception as e:
                  print(f"== {tag}: ERR {str(e)[:200]}", flush=True)
          show("www.vworld.kr main", "https://www.vworld.kr/")
          p = {"service": "data", "request": "GetFeature", "data": "LP_PA_CBND_BUBUN", "key": K, "format": "json",
               "geomFilter": "POINT(126.97797 37.56654)", "crs": "EPSG:4326", "size": 1, "geometry": "false",
               "domain": "https://ms1238.github.io/korea-lodging-dashboard-/"}
          for scheme in ("https", "http"):
              show(f"{scheme} data plain", f"{scheme}://api.vworld.kr/req/data", params=p)
              show(f"{scheme} data browser-UA", f"{scheme}://api.vworld.kr/req/data", params=p, headers=UA)
          show("https address browser-UA", "https://api.vworld.kr/req/address", headers=UA,
               params={"service": "address", "request": "getcoord", "version": "2.0", "crs": "epsg:4326", "type": "road",
                       "address": "서울특별시 중구 세종대로 110", "format": "json", "key": K})
          # fallback: 국토교통부 개별공시지가 속성조회 on data.go.kr (needs a PNU; 서울시청 부지 태평로1가 31)
          for base in ("https://apis.data.go.kr/1611000/nsdi/IndvdLandPriceService/attr/getIndvdLandPriceAttr",):
              show("data.go.kr 개별공시지가", base, params={"serviceKey": DK, "pnu": "1114010300100310000", "stdrYear": "2025",
                                                       "format": "json", "numOfRows": 3, "pageNo": 1})
