# Temporary: where to get boundaries of Incheon's new 구 (검단·서해·영종·제물포, 2026.7).
name: Probe Incheon boundaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-incheon.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - shell: python
        run: |
          import json, time, requests
          H = {"User-Agent": "korea-lodging-dashboard probe"}
          q = """[out:json][timeout:120];
          (relation["name"~"검단구|서해구|영종구|제물포구"](37.2,126.0,37.8,126.9);
           relation["boundary"="administrative"]["admin_level"~"^(7|8)$"](37.3,126.3,37.65,126.75););
          out tags;"""
          for url in ("https://overpass-api.de/api/interpreter", "https://overpass.private.coffee/api/interpreter"):
              try:
                  els = requests.post(url, data={"data": q}, headers=H, timeout=200).json()["elements"]
                  named = [e for e in els if any(k in e.get("tags", {}).get("name", "") for k in ("검단구", "서해구", "영종구", "제물포구"))]
                  print("== OSM named", [(e["id"], e["tags"]) for e in named][:10])
                  lv = [(e["tags"].get("admin_level"), e["tags"].get("name")) for e in els if e not in named]
                  print("== OSM level 7/8 in Incheon:", len(lv), sorted(lv)[:200], flush=True)
                  break
              except Exception as e:
                  print("overpass fail", url, e, flush=True); time.sleep(5)
          r = requests.get("https://api.github.com/repos/vuski/admdongkor/contents", headers=H, timeout=60)
          print("== vuski root", r.status_code, [x["name"] for x in r.json()] if r.ok else r.text[:200])
          if r.ok:
              vers = sorted(x["name"] for x in r.json() if x["type"] == "dir" and x["name"].startswith("ver"))
              print("== versions", vers[-6:])
              if vers:
                  r2 = requests.get(f"https://api.github.com/repos/vuski/admdongkor/contents/{vers[-1]}", headers=H, timeout=60)
                  files = [x for x in r2.json()] if r2.ok else []
                  print("== latest files", [(x["name"], x["size"]) for x in files])
                  gj = [x for x in files if x["name"].endswith(".geojson")]
                  if gj:
                      t = requests.get(gj[0]["download_url"], headers=H, timeout=180).text
                      d = json.loads(t)
                      props = [f["properties"] for f in d["features"]]
                      print("== props sample", props[0])
                      inc = sorted({p.get("sggnm") or p.get("SIG_KOR_NM") or "" for p in props if "인천" in json.dumps(p, ensure_ascii=False)})
                      print("== incheon sgg names", inc)
          r = requests.get("https://api.github.com/search/repositories", params={"q": "행정동 경계 geojson 2026", "sort": "updated"}, headers=H, timeout=60)
          print("== search", [(x["full_name"], x["pushed_at"]) for x in r.json().get("items", [])[:8]] if r.ok else r.status_code)
