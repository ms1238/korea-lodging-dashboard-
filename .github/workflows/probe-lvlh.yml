# Temporary: what 1480523/LvlhPpnSttusService (국립환경과학원 생활계 인구현황, data.go.kr 15058230) offers.
name: Probe living population API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-lvlh.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, time, requests
          K = os.environ["KEY"]; H = {"User-Agent": "Mozilla/5.0"}
          p = requests.get("https://www.data.go.kr/data/15058230/openapi.do", headers=H, timeout=60).text
          txt = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", re.sub(r"(?s)<(script|style).*?</\1>", "", p)))
          for kw in ("설명", "제공기관", "업데이트 주기", "키워드"):
              i = txt.find(kw); print("== TXT", kw, txt[i:i + 500] if i >= 0 else "-")
          ops = sorted(set(re.findall(r"LvlhPpnSttusService(/\w+)", p)) | set(re.findall(r'"(/get\w+)"', p)))
          print("== ops in page", ops)
          for m in re.finditer(r"(?s)(swagger\w*\s*=\s*[`'\"{].{0,200})", p):
              print("== swagger hint", m.group(1)[:200].replace("\n", " "))
          for op in ops or ["/getLvlhPpnSttus"]:
              for extra in ({"type": "json"}, {"returnType": "json"}, {}):
                  r = requests.get(f"https://apis.data.go.kr/1480523/LvlhPpnSttusService{op}", params={"serviceKey": K, "pageNo": 1, "numOfRows": 3, **extra}, timeout=60)
                  print("== CALL", op, extra, r.status_code, r.text[:1500].replace("\n", " "), flush=True)
