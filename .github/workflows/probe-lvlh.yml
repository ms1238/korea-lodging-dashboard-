# Temporary: parameters of 1480523/LvlhPpnSttusService/getLvlhPpnSttusInfo (year filter, JSON, page size, latest year).
name: Probe living population API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-lvlh.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, time, requests
          K = os.environ["KEY"]; U = "https://apis.data.go.kr/1480523/LvlhPpnSttusService/getLvlhPpnSttusInfo"
          def call(**p):
              t0 = time.time()
              r = requests.get(U, params={"serviceKey": K, "pageNo": 1, "numOfRows": 2, **p}, timeout=90)
              tc = re.findall(r"<totalCount>(\d+)</totalCount>|\"totalCount\":\s*\"?(\d+)", r.text)
              yrs = re.findall(r"<year>(\d+)</year>|\"year\":\s*\"?(\d+)", r.text)
              return f"{r.status_code} {time.time()-t0:.1f}s total={tc[:1]} years={yrs[:2]} ctype={r.headers.get('content-type')} head={r.text[:160]!r}"
          print("== base", call(), flush=True)
          for k in ("year", "searchYear", "srchYear", "yyyy", "surveyYear", "YEAR", "yr", "baseYear"):
              print("== year param", k, call(**{k: "2023"}), flush=True)
          for k, v in (("_type", "json"), ("resultType", "json"), ("dataType", "JSON"), ("returnType", "JSON"), ("type", "JSON")):
              print("== json", k, v, call(**{k: v}), flush=True)
          for n in (100, 1000, 5000):
              print("== rows", n, call(numOfRows=n), flush=True)
          # last page: the newest year if the list is sorted by year
          m = re.search(r"<totalCount>(\d+)</totalCount>", requests.get(U, params={"serviceKey": K, "pageNo": 1, "numOfRows": 1}, timeout=90).text)
          if m:
              tot = int(m.group(1)); print("== total", tot)
              r = requests.get(U, params={"serviceKey": K, "pageNo": tot, "numOfRows": 1}, timeout=90)
              print("== last item", r.text[:1200].replace("\n", " "), flush=True)
