# Temporary: 관광수지 getTourismBalcList (operation name from the data.go.kr request address).
name: Probe tourism balance API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-balance.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, requests
          K = os.environ["KEY"]; U = "http://openapi.tour.go.kr/openapi/service/EdrcntTourismBalnaceService/getTourismBalcList"
          for p in ({"YM": "201205"}, {"YM": "202508"}, {"YM": "202601"}, {"YM": "202508", "_type": "json"}):
              try:
                  r = requests.get(U, params={"serviceKey": K, **p}, timeout=30)
                  print(f"== {p} {r.status_code} {r.headers.get('content-type')} {r.text[:900]!r}", flush=True)
              except Exception as e:
                  print(f"== {p} ERR {e}", flush=True)
