# Temporary: re-check 출입국관광수지서비스 (2026-10-29).
name: Probe tourism balance API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-balance.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, requests
          base = "http://openapi.tour.go.kr/openapi/service/EdrcntTourismBalnaceService/getTourismBalcList"
          for ym in ("202508", "201205"):
              try:
                  r = requests.get(base, params={"serviceKey": os.environ["KEY"], "YM": ym}, timeout=30)
                  print(f"== {ym} {r.status_code} {r.text[:1500]!r}", flush=True)
              except Exception as e:
                  print(f"== {ym} ERR {e}", flush=True)
