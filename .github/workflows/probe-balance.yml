# Temporary: operations of tour.go.kr EdrcntTourismBalnaceService from its WADL, then a sample call.
name: Probe tourism balance API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-balance.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, requests
          K = os.environ["KEY"]; B = "http://openapi.tour.go.kr/openapi/service"
          # round 3: 관광수지 on the data.go.kr gateway (B551940, where 출입국관광통계 already works) and on tour.go.kr
          G = "https://apis.data.go.kr/B551940/"
          def call(tag, url, **p):
              r = requests.get(url, params={"serviceKey": K, "numOfRows": 5, "pageNo": 1, **p}, timeout=60)
              print(f"== {tag} {r.status_code} {r.text[:400]!r}", flush=True)
          call("control: stats list", G + "EdrcntTourismStatsService/getEdrcntTourismStatsList", YM="202508", NAT_CD="112", ED_CD="E")
          for svc in ("EdrcntTourismStatsService", "EdrcntTourismBalnaceService", "EdrcntTourismBalanceService", "TourismBalnaceService", "TourismBalanceService"):
              for op in ("getEdrcntTourismBalnaceList", "getTourismBalnaceList", "getEdrcntTourismBalanceList", "getTourismBalanceList", "getBalnaceList"):
                  call(f"{svc}/{op}", G + f"{svc}/{op}", YM="202508")
          for op in ("getEdrcntTourismBalnaceList", "getTourismBalnaceList"):
              for p in ({"YM": "202508", "_type": "xml"}, {"YYYYMM": "202508"}, {"STD_YM": "202508"}):
                  call(f"tour.go.kr {op} {p}", B + "/EdrcntTourismBalnaceService/" + op, **p)
