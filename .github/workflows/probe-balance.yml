# Temporary: 관광수지 getTourismBalcList (operation name from the data.go.kr request address).
name: Probe tourism balance API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-balance.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, requests
          from urllib.parse import quote, unquote
          K = os.environ["KEY"]; U = "http://openapi.tour.go.kr/openapi/service/EdrcntTourismBalnaceService/getTourismBalcList"
          print("key looks url-encoded:", "%" in K, flush=True)
          for tag, k in (("raw", K), ("quoted", quote(unquote(K), safe="")), ("unquoted", unquote(K))):
              try:
                  r = requests.get(f"{U}?YM=202508&serviceKey={k}", timeout=30)
                  print(f"== {tag} {r.status_code} {r.text[:600]!r}", flush=True)
              except Exception as e:
                  print(f"== {tag} ERR {e}", flush=True)
