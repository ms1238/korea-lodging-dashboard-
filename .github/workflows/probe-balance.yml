# Temporary: re-check 출입국관광수지서비스 (approved on data.go.kr 2026-10-20).
name: Probe tourism balance API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-balance.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, requests
          from urllib.parse import quote, unquote
          K = os.environ["KEY"]
          enc = "%" in K
          print("key looks url-encoded:", enc, flush=True)
          dec = unquote(K) if enc else K
          def show(tag, url, **kw):
              try:
                  r = requests.get(url, timeout=30, **kw)
                  print(f"== {tag} {r.status_code} {r.text[:600]!r}", flush=True)
              except Exception as e:
                  print(f"== {tag} ERR {e}", flush=True)
          for host in ("http://openapi.tour.go.kr", "https://openapi.tour.go.kr"):
              base = host + "/openapi/service/EdrcntTourismBalnaceService/getTourismBalcList"
              for ym in ("202508", "201205"):
                  show(f"{host} {ym} params", base, params={"serviceKey": dec, "YM": ym})
                  show(f"{host} {ym} raw-encoded", f"{base}?serviceKey={quote(dec, safe='')}&YM={ym}")
          for base in ("https://apis.data.go.kr/B551940/EdrcntTourismBalnaceService", "https://apis.data.go.kr/B551940/EdrcntTourismBalanceService"):
              show(f"{base.split('/')[-1]}", base + "/getTourismBalcList", params={"serviceKey": dec, "YM": "202508", "_type": "json"})
