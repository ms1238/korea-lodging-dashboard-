# Temporary: 출입국관광수지서비스 on the data.go.kr gateway (approved 2026-10-20).
name: Probe tourism balance API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-balance.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, requests
          K = os.environ["KEY"]
          for base in ("https://apis.data.go.kr/B551940/EdrcntTourismBalnaceService", "https://apis.data.go.kr/B551940/EdrcntTourismBalanceService",
                       "http://openapi.tour.go.kr/openapi/service/EdrcntTourismBalnaceService"):
              for p in ({"YM": "202508"}, {"YM": "202508", "_type": "json"}, {"YM": "202508", "numOfRows": 100, "pageNo": 1, "_type": "json"}):
                  try:
                      r = requests.get(base + "/getTourismBalcList", params={"serviceKey": K, **p}, timeout=30)
                      print(f"== {base.split('/')[-1]} {base.split('/')[2]} {p} {r.status_code} {r.text[:900]!r}", flush=True)
                  except Exception as e:
                      print("== ERR", base, e, flush=True)
