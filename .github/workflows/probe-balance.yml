# Temporary: operations of tour.go.kr EdrcntTourismBalnaceService from its WADL, then a sample call.
name: Probe tourism balance API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-balance.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, requests
          K = os.environ["KEY"]; B = "http://openapi.tour.go.kr/openapi/service"
          lst = requests.get(B, timeout=60).text
          print("== services", sorted(set(re.findall(r"openapi/service/(\w+)", lst))), flush=True)
          for svc in ("EdrcntTourismBalnaceService", "EdrcntTourismStatsService"):
              w = requests.get(f"{B}/{svc}?_wadl", timeout=60).text
              print(f"== wadl {svc} ({len(w)} chars)\n{w[:3000]}", flush=True)
              ops = re.findall(r'<resource path="/?(\w+)"', w)
              params = sorted(set(re.findall(r'<param name="(\w+)"', w)))
              print("== ops", ops, "params", params, flush=True)
              if svc.startswith("EdrcntTourismBalnace"):
                  for op in ops:
                      for p in ({"YM": "202508"}, {"YEAR": "2025"}, {"YYYY": "2025"}, {"MM": "08", "YYYY": "2025"}, {}):
                          r = requests.get(f"{B}/{svc}/{op}", params={"serviceKey": K, "numOfRows": 5, "pageNo": 1, **p}, timeout=60)
                          print(f"== call {op} {p} {r.status_code} {r.text[:700]!r}", flush=True)
