name: Update data and deploy

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 03:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write  # monthly snapshot release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 공공데이터포털 APIs have daily request quotas. A code push rebuilds from the data of the last run;
      # the daily schedule and manual runs fetch again (monthly sources only refresh their latest months).
      - name: Restore raw data from the last run
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Fetch permit APIs, TourAPI, DataLab and arrivals
        if: github.event_name != 'push' || steps.raw.outputs.cache-matched-key == ''
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch.py
      - name: Fetch only sources missing from the cached data (code pushes)
        if: github.event_name == 'push' && steps.raw.outputs.cache-matched-key != ''
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch.py --only-missing
      - name: Save raw data for later runs
        if: hashFiles('fetched.flag') != ''
        uses: actions/cache/save@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
      - name: Build dashboard data
        run: python scripts/build.py
      # The permit APIs only give the current state, so keep the first scheduled/manual build of each month.
      - name: Monthly snapshot (GitHub Release)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="snapshot-$(TZ=Asia/Seoul date +%Y-%m)"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            f="lodging_$(TZ=Asia/Seoul date +%Y-%m-%d).csv.gz"
            cp site/data/download/lodging.csv.gz "$f"
            gh release create "$tag" "$f" site/codebook.html --title "숙박시설 스냅샷 $(TZ=Asia/Seoul date +%Y-%m)" \
              --notes "$(TZ=Asia/Seoul date +%Y-%m-%d) 기준 전국 숙박시설 인허가 데이터(중복 제거·지역 매칭 후). 열 설명은 codebook.html."
          fi
      - name: Version the page assets so browsers do not mix a new page with cached old scripts
        run: sed -i -E "s/(app\.js|style\.css)\"/\1?v=${GITHUB_SHA::7}\"/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
