# Temporary: sample responses of the transit / airport APIs and their portal specs (data.go.kr is unreachable from the dev sandbox).
name: Probe transit APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-transit.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import json, os, re, requests
          K = os.environ["KEY"]
          H = {"User-Agent": "Mozilla/5.0"}
          A = "https://apis.data.go.kr/"
          def call(path, **p):
              try:
                  r = requests.get(A + path, params={"serviceKey": K, **p}, timeout=90)
                  t = r.text
                  m = re.search(r'"totalCount"\s*:\s*"?(\d+)', t) or re.search(r"<totalCount>(\d+)", t)
                  print(f"== {path} {p} [{r.status_code}] totalCount={m.group(1) if m else None}\n{t[:1200]}\n", flush=True)
              except Exception as e:
                  print(f"== {path} {p} ERROR {type(e).__name__}", flush=True)
          def spec(cid, ops=None):
              t = requests.get(f"https://www.data.go.kr/data/{cid}/openapi.do", headers=H, timeout=90).text
              m = re.search(r"swaggerJson\s*=\s*`(.*?)`", t, re.S)
              if not m or not m.group(1).strip():
                  i = t.find("요청변수")
                  print(f"== SPEC {cid}: no swagger; text near 요청변수:", re.sub(r"<[^>]+>|\s+", " ", t[i:i + 6000])[:3000] if i >= 0 else None, flush=True)
                  return
              sw = json.loads(m.group(1))
              for path, v in sw["paths"].items():
                  g = v.get("get", {})
                  if ops and path.strip("/") not in ops:
                      print(f"   {path}: {g.get('summary')}"); continue
                  props = g.get("responses", {}).get("200", {}).get("schema", {})
                  fields = re.findall(r'"(\w+)":\{"type":"(?:string|number|integer)","description":"([^"]*)"', json.dumps(props, ensure_ascii=False))
                  print(f"== SPEC {cid} {path}: {g.get('summary')}\n   desc: {re.sub('<[^>]+>', ' ', g.get('description', ''))[:300]}"
                        f"\n   params: {[(x['name'], x.get('required')) for x in v.get('parameters', [])]}\n   fields: {fields}", flush=True)
          spec("15141028")
          spec("15095071")
          y = "2025"
          call("1613000/PublicTransportationPassengerCount/getAnnualPublicTransportationPassengerCount", pageNo=1, numOfRows=3, opr_yr=y, ctpv_cd="11", dataType="JSON")
          call("1613000/PublicTransportationPassengerCount/getMonthlyPublicTransportationPassengerCount", pageNo=1, numOfRows=3, opr_ym="202508", ctpv_cd="11", dataType="JSON")
          call("1613000/BusStop/getBusStop", pageNo=1, numOfRows=3, opr_ymd="20250801", ctpv_cd="11", sgg_cd="11110", dataType="JSON")
          call("B551457/issueStatistics/mainLineStationPer", pageNo=1, numOfRows=3, returnType="json", **{"cond[opr_ymd::EQ]": "20251001"})
          call("B551457/issueStatistics/wideRailloadStationPer", pageNo=1, numOfRows=3, returnType="json")
          call("B551177/AviationStatsByCountry/getTotalNumberOfPassenger", pageNo=1, numOfRows=2, type="json")
