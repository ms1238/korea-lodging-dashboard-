# Temporary: sample responses of the transit / airport APIs and their portal specs (data.go.kr is unreachable from the dev sandbox).
name: Probe transit APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-transit.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        shell: python
        run: |
          import os, re, requests
          H = {"User-Agent": "Mozilla/5.0"}
          def show(label, u, n=8000, **kw):
              try:
                  r = requests.get(u, timeout=90, headers=H, **kw)
                  print(f"== {label} [{r.status_code}]\n{r.text[:n]}\n", flush=True)
                  return r.text
              except Exception as e:
                  print(f"== {label} ERROR {type(e).__name__}", flush=True)
                  return ""
          # dataset ids by keyword (portal search page), then the swagger spec embedded in each openapi.do page
          ids = {"15142032": "BusStop", "15142080": "PassengerCount"}
          for kw in ("AviationStatsByCountry", "인천국제공항공사 국가별", "한국철도공사 발권", "issueStatistics"):
              t = show(f"SEARCH {kw}", "https://www.data.go.kr/tcs/dss/selectDataSetList.do", 0, params={"keyword": kw, "dType": "API"})
              found = list(dict.fromkeys(re.findall(r"/data/(\d{8})/openapi\.do", t)))[:4]
              print(f"   ids for {kw}: {found}", flush=True)
              for x in found:
                  ids.setdefault(x, kw)
          for cid, kw in ids.items():
              t = show(f"PAGE {cid} ({kw})", f"https://www.data.go.kr/data/{cid}/openapi.do", 0)
              title = re.search(r"<title>(.*?)</title>", t, re.S)
              print("   title:", title.group(1).strip() if title else None)
              m = re.search(r"swaggerJson\s*=\s*`(.*?)`", t, re.S) or re.search(r"swaggerJson\s*=\s*'(.*?)';", t, re.S)
              print("   swagger:", (m.group(1)[:7000] if m else "not found; context: " + " | ".join(re.findall(r".{0,80}swagger.{0,120}", t)[:5])), flush=True)
          show("ODCLOUD swagger", "https://infuser.odcloud.kr/oas/docs?namespace=15002610/v1", 8000)
          show("ODCLOUD api-docs", "https://infuser.odcloud.kr/api/stages/15002610/api-docs?1", 8000)
